server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 51m;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location ~ ^/api/workbooks/[^/]+/sheets/[0-9]+/proofreading$ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3610s;
    }

    location /_framework/ {
        gzip_static on;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /pdfjs/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
