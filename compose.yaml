services:
  api:
    build: ./backend
    environment:
      DataDirectory: /data
      Llm__BaseUrl: ${LLM_BASE_URL:-}
      Llm__Model: ${LLM_MODEL:-}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__UseJsonSchema: ${LLM_USE_JSON_SCHEMA:-true}
      Llm__TimeoutSeconds: ${LLM_TIMEOUT_SECONDS:-120}
    volumes:
      - type: bind
        source: ${PDF_DATA_DIR:-./data}
        target: /data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 2s
      retries: 10
  web:
    build:
      context: .
      dockerfile: frontend-blazor/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PDF_HIGHLIGHT_PORT:-8080}:8080"
